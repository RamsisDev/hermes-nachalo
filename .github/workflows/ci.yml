name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  UV_EXCLUDE_NEWER: "3 days"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - name: Lint
        run: uvx ruff@0.14 check . && uvx ruff@0.14 format --check .
      - name: Unit and integration tests (memory relay)
        run: |
          uv venv --python 3.14
          uv pip install -r pyproject.toml pytest
          uv run --no-project python -m pytest tests
      - name: Against Hermes (doctor, validate, REST routes)
        run: |
          # Full history and tags, blobs on demand, as the catalog CI does: Hermes reads its
          # version from the release tags, and a shallow clone reports "unknown".
          git clone --filter=blob:none https://github.com/NousResearch/hermes-agent /tmp/hermes
          # uv sync applies Hermes's own uv.lock and [tool.uv] overrides; uv pip install -e does not.
          uv sync --project /tmp/hermes --frozen --python 3.14
          uv pip install --python /tmp/hermes/.venv/bin/python -r pyproject.toml pytest
          export HERMES_HOME="$(mktemp -d)"
          /tmp/hermes/.venv/bin/hermes plugins doctor . --ci
          /tmp/hermes/.venv/bin/hermes plugins validate . --install-deps
          /tmp/hermes/.venv/bin/python -m pytest tests/test_hermes_integration.py
